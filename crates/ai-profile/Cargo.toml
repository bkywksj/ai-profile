[package]
name = "ai-profile"
description = "AI 模型服务配置层：provider 预置、ai.profile 互通协议、端点拼接与连通性验证"
keywords = ["llm", "ai", "provider", "config"]
categories = ["api-bindings", "config"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# 🔴 docs.rs 默认只用默认 feature（chat）构建：不开的话 client（验证）与 media（生图 / 视频 / 配音）
# 在文档站上整块消失 —— 0.1.0 就漏了这条，只能补发 0.1.1
[package.metadata.docs.rs]
all-features = true

[features]
# 🔴 默认只给纯数据 + 纯函数：零重依赖，能编到 Android / iOS。
# 不用的 kind 不编进下游的二进制。
default = ["chat"]
chat = []
image = []
# 视频带一个图像解码库：New API 中转站的请求体有限额，大首帧要先压成 JPEG（见 media::video）。
# 只有开了视频的下游才编译它；只要视频预置数据、不做调用的下游若嫌重，再拆 feature。
video = ["dep:img"]
tts = []
# 真实 HTTP 调用（verify / dry_run / fetch_models）。拉 reqwest，按需开启。
# 开了 image / video / tts 时还会带上多模态调用（crate::media）；base64 给配音 / 生图解码响应
client = ["dep:reqwest", "dep:tokio", "dep:base64", "dep:log"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", optional = true, features = ["time"] }
base64 = { version = "0.22", optional = true }
log = { version = "0.4", optional = true }
# 依赖改名为 img：包名 image 与本 crate 的 `image` feature 重名
img = { package = "image", version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
# 异步单测（media 分发层的防呆断言）
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# 多模态调用的模拟服务端测试（tests/media_mock.rs）：本地起 HTTP 服务，按各家协议回放响应
wiremock = "0.6"
base64 = "0.22"

# 可运行示例：CI 里随 --all-targets 一起编译，接口一改示例就编不过 —— 不会像文档片段那样悄悄过时。
# 只有 verify 要发 HTTP，需要 client；其余是纯数据 / 纯函数，默认 feature 就能跑。
[[example]]
name = "verify"
required-features = ["client"]
