<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><title>ai-profile Logo 成品预览</title>
<style>
body{margin:0;font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#f5f5f7;color:#1d1d1f}
section{max-width:1100px;margin:24px auto;padding:0 16px}
h2{font-size:14px;color:#444;margin:0 0 10px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.tile{background:#fff;border-radius:12px;padding:14px;text-align:center;font-size:11px;color:#888}
.tile.dk{background:#121212;color:#777}
.tile img{display:block;margin:0 auto 8px}
.check{background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
</style></head><body>
<section><h2>SVG 各变体（浅底 / 深底）</h2><div class="row">
  <div class="tile"><img src="ai-profile.svg" width="120">主标识</div>
  <div class="tile dk"><img src="ai-profile_dark.svg" width="120">_dark</div>
  <div class="tile"><img src="ai-profile_mark.svg" width="120">_mark</div>
  <div class="tile dk"><img src="ai-profile_mark_dark.svg" width="120">_mark_dark</div>
  <div class="tile dk"><img src="ai-profile_mono_white.svg" width="120">_mono_white</div>
  <div class="tile"><img src="ai-profile_mono_black.svg" width="120">_mono_black</div>
</div></section>
<section><h2>PNG 实际像素（16 → 256）</h2><div class="row">
  <div class="tile"><img src="png/ai-profile_16x16.png">16</div>
  <div class="tile"><img src="png/ai-profile_32x32.png">32</div>
  <div class="tile"><img src="png/ai-profile_48x48.png">48</div>
  <div class="tile"><img src="png/ai-profile_64x64.png">64</div>
  <div class="tile"><img src="png/ai-profile_128x128.png">128</div>
  <div class="tile"><img src="png/ai-profile_256x256.png">256</div>
  <div class="tile dk"><img src="png-dark/ai-profile_dark_32x32.png">dark 32</div>
  <div class="tile dk"><img src="png-dark/ai-profile_dark_128x128.png">dark 128</div>
</div></section>
<section><h2>Favicon / PWA / 透明版</h2><div class="row">
  <div class="tile"><img src="favicon/favicon-16x16.png">favicon 16</div>
  <div class="tile"><img src="favicon/favicon-32x32.png">favicon 32</div>
  <div class="tile"><img src="favicon/apple-touch-icon.png" width="90" style="border-radius:20px">apple-touch（iOS 切圆角后）</div>
  <div class="tile"><img src="favicon/maskable-icon-512.png" width="90" style="border-radius:50%">maskable（圆形裁切）</div>
  <div class="tile check"><img src="transparent/ai-profile_transparent_256.png" width="90">透明</div>
</div></section>
<section><h2>横排 / 竖排</h2><div class="row">
  <img src="lockup/ai-profile_horizontal_light.png" width="440">
  <img src="lockup/ai-profile_horizontal_dark.png" width="440">
  <img src="lockup/ai-profile_horizontal_mono.png" width="440">
</div><div class="row" style="margin-top:14px">
  <img src="lockup/ai-profile_vertical_light.png" width="260">
  <img src="lockup/ai-profile_vertical_dark.png" width="260">
  <img src="lockup/ai-profile_vertical_mono.png" width="260">
</div></section>
</body></html>
