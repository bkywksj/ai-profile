name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# 🔴 这里只做「代码自洽」检查，绝不访问任何服务商端点。
#    探活是 `cargo xtask probe`，人工季度触发 —— 放进 CI 等于每次 PR 都滥用人家的接口，
#    而且网络波动会让 CI 随机红。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 🔴 必须用 -p 而不是 --workspace：xtask 依赖 ai-profile 的 client feature，
      #    workspace 级命令会触发 feature unification，让 ai-profile 永远带上 client
      #    —— 那样「不带 client 能否编译」这条就永远测不到（实测踩过）
      - name: test (default features, no client)
        run: cargo test -p ai-profile

      # 纯配置形态：无默认 feature、只开 chat。移动端 / 不需要 HTTP 的接入方用这个
      - name: test (chat only, no client)
        run: cargo test -p ai-profile --no-default-features --features chat

      # 开 client：verify 的错误映射等一批测试只在这个组合下编译
      - name: test (with client)
        run: cargo test -p ai-profile --features client

      # 🔴 多模态 feature 单独验：kind.rs 里有 #[cfg(feature)] 分支，
      #    不开的话 image/video/tts 的 match 臂根本没被编译过
      - name: test (all features)
        run: cargo test --workspace --all-features

      # 文档内链接失效在本地只是 warning，发到 docs.rs 就是页面上的断链 —— CI 里当错误处理
      - name: doc (no warnings)
        run: cargo doc -p ai-profile --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # 用声明的最低版本真编一遍，rust-version 才不是一句空话
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # 库不提交 Cargo.lock：让解析器挑兼容 1.88 的依赖版本，模拟下游用老编译器时的真实情况
      - name: check (all features)
        run: cargo check -p ai-profile --all-features
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
